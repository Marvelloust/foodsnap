<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760"><rect width="1000" height="760" fill="#315371"/><rect x="105" y="70" width="790" height="620" rx="18" fill="#FFF8EB"/><text x="170" y="155" font-family="Georgia" font-size="45" fill="#E55D3F">COCONUT CHICKPEA CURRY</text><text x="170" y="225" font-family="Arial" font-size="22" font-weight="700" fill="#4A2945">INGREDIENTS</text><g font-family="Arial" font-size="20" fill="#2A2522"><text x="170" y="270">2 cans chickpeas</text><text x="170" y="310">400 ml coconut milk</text><text x="170" y="350">3 cups spinach</text><text x="170" y="390">3 tomatoes</text><text x="540" y="225" font-weight="700">METHOD</text><text x="540" y="270">1. Cook aromatics.</text><text x="540" y="310">2. Add tomato.</text><text x="540" y="350">3. Simmer 20 minutes.</text><text x="540" y="390">4. Fold in spinach.</text></g></svg>
